# Decap CMS config, generated by `site-kit decap-config` from .hostsmith/schema.json.
# Don't edit this file: change the site's collections, then run
# `npx site-kit schema` and `npm run decap-config`.
#
# Decap CMS and Sveltia CMS both read it. The build removes /admin, so it is
# never deployed.
backend:
  name: github
  repo: example-agency/bakery-site
  branch: main
media_folder: public/assets
public_folder: /assets
i18n:
  structure: multiple_files
  locales:
    - en
    - de
  default_locale: en
collections:
  - name: copy
    label: Copy
    i18n:
      structure: single_file
    files:
      - name: about
        label: About
        file: src/content/copy/about.yml
        i18n: true
        fields:
          - name: title
            label: Title
            widget: string
            i18n: true
          - name: intro
            label: Intro
            widget: string
            i18n: true
      - name: home
        label: Home
        file: src/content/copy/home.yml
        i18n: true
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - name: title
                label: Title
                widget: string
                i18n: true
              - name: text
                label: Text
                widget: string
                i18n: true
            i18n: true
  - name: news
    label: News
    folder: src/content/news
    i18n:
      structure: multiple_folders
    extension: md
    format: frontmatter
    create: true
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
        i18n: true
      - name: summary
        label: Summary
        widget: string
        i18n: true
      - name: body
        label: Body
        widget: markdown
        i18n: true
