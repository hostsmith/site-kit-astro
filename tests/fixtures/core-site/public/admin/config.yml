# Decap CMS config, generated by `site-kit decap-config` from .hostsmith/schema.json.
# Don't edit this file: change the site's collections, then run
# `npx site-kit schema` and `npm run decap-config`.
#
# Decap CMS and Sveltia CMS both read it. The build removes /admin, so it is
# never deployed.
backend:
  name: github
  repo: example-agency/bakery-site
  branch: main
media_folder: public/assets
public_folder: /assets
collections:
  - name: copy
    label: Copy
    files:
      - name: about
        label: About
        file: src/content/copy/about.yml
        fields:
          - name: title
            label: Title
            widget: string
          - name: intro
            label: Intro
            widget: string
          - name: bakes
            label: Bakes
            widget: object
            fields:
              - name: title
                label: Title
                widget: string
              - name: items
                label: Items
                widget: list
                field:
                  name: item
                  label: Items
                  widget: string
      - name: home
        label: Home
        file: src/content/copy/home.yml
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - name: title
                label: Title
                widget: string
              - name: text
                label: Text
                widget: string
              - name: linkLabel
                label: Link label
                widget: string
          - name: latestTitle
            label: Latest title
            widget: string
      - name: site
        label: Site
        file: src/content/copy/site.yml
        fields:
          - name: name
            label: Name
            widget: string
          - name: nav
            label: Nav
            widget: object
            fields:
              - name: about
                label: About
                widget: string
              - name: news
                label: News
                widget: string
          - name: footer
            label: Footer
            widget: string
  - name: news
    label: News
    folder: src/content/news
    extension: md
    format: frontmatter
    create: true
    fields:
      - name: title
        label: Title
        widget: string
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        date_format: YYYY-MM-DD
        time_format: false
      - name: summary
        label: Summary
        widget: string
        hint: One sentence for the news list.
      - name: category
        label: Category
        widget: select
        options:
          - Bakery
          - Events
      - name: image
        label: Image
        widget: image
        required: false
      - name: featured
        label: Featured
        widget: boolean
        required: false
      - name: body
        label: Body
        widget: markdown
