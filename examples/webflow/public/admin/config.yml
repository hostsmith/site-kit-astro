  - name: news
    label: News
    label_singular: News entry
    folder: src/content/news
    i18n: true
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string, i18n: true }
