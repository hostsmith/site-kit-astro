      - { name: image, label: Image, widget: image, required: false, i18n: true }
      - { name: imageAlt, label: Image alt text, widget: string, required: false, i18n: true }
      - { name: draft, label: Draft, widget: boolean, required: false, i18n: true }
      - { name: body, label: Body, widget: markdown, i18n: true }
