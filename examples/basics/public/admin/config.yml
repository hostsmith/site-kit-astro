# Decap CMS config, assembled by `npm run decap-config` from the kit's part
# (@hostsmith/site-kit-astro/decap/config.kit.yml) and this site's part
# (public/admin/config.site.yml). Don't edit this file: edit the site's
# part and run the command again.
#
# Decap CMS and Sveltia CMS both read it. The build removes /admin, so it is
# never deployed.
backend:
  name: github
  repo: OWNER/REPOSITORY
  branch: main
media_folder: public/assets
public_folder: /assets

collections:
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    extension: md
    format: frontmatter
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - { name: ogImage, label: Social image, widget: image, required: false }
      - &sections
        name: sections
        label: Sections
        widget: list
        typeKey: type
        types:
          - name: hero
            label: Hero
            widget: object
            fields:
              - &section_id { name: id, label: Section id, widget: string, pattern: ["^[a-z](?=[a-z0-9]*[0-9])[a-z0-9]{3}$", "A lowercase letter, then 3 lowercase letters or digits, with at least one digit"], hint: "A random label that keeps pointing at this section when sections move. For a new section, run npm run section-id -- <page file> for an id this page has never used, such as k3m9. Never change it or copy it from another section." }
              - { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: badge, label: Badge, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string, required: false }
              - { name: image, label: Image, widget: image, required: false }
              - { name: imageAlt, label: Image alt text, widget: string, required: false }
              - name: cta
                label: Call to action
                widget: object
                required: false
                fields: &labeled_link
                  - { name: label, label: Label, widget: string }
                  - { name: link, label: Link, widget: string }
              - { name: secondaryCta, label: Second button, widget: object, required: false, fields: *labeled_link }
              - { name: note, label: Note under the buttons, widget: string, required: false }
              - { name: variant, label: Variant, widget: select, options: [centered, image-left, image-right, background, page], default: centered }
          - name: rich-text
            label: Rich text
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - { name: body, label: Body, widget: markdown }
              - { name: variant, label: Variant, widget: select, options: [narrow, wide, title-aside], default: narrow }
          - name: collection-list
            label: Collection list
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: collection
                label: Collection
                widget: select
                options: [news]
              - { name: limit, label: Limit, widget: number, value_type: int, min: 1, required: false }
              - { name: link, label: Link beside the title, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [cards, list, featured], default: cards }
          - name: services-grid
            label: Services grid
            widget: object
            fields:
              - *section_id
              - &eyebrow_field { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: link, label: Link beside the title, widget: object, required: false, fields: *labeled_link }
              - name: items
                label: Services
                label_singular: Service
                widget: list
                min: 1
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text, required: false }
                  # The kit's icon set: src/lib/icons.ts lists the same names.
                  - &icon_field
                    name: icon
                    label: Icon
                    widget: select
                    required: false
                    options:
                      [calendar, check, clock, file-text, hammer, house, mail, map-pin, paint-roller, phone, ruler, shield-check, sparkles, star, users, wrench]
                  - { name: image, label: Image, widget: image, required: false }
                  - { name: imageAlt, label: Image alt text, widget: string, required: false }
                  - { name: link, label: Link, widget: string, required: false }
              - { name: variant, label: Variant, widget: select, options: [cards, list], default: cards }
              - { name: tone, label: Tone, widget: select, options: [plain, surface], default: plain }
          - name: gallery
            label: Gallery
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: images
                label: Images
                label_singular: Image
                widget: list
                min: 1
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: alt, label: Alt text, widget: string }
                  - { name: caption, label: Caption, widget: string, required: false }
              - { name: variant, label: Variant, widget: select, options: [grid, masonry], default: grid }
          - name: testimonials
            label: Testimonials
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Testimonials
                label_singular: Testimonial
                widget: list
                min: 1
                fields:
                  - { name: quote, label: Quote, widget: text }
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string, required: false }
                  - { name: image, label: Photo, widget: image, required: false }
                  - { name: imageAlt, label: Photo alt text, widget: string, required: false }
              - { name: variant, label: Variant, widget: select, options: [grid, single], default: grid }
              - { name: tone, label: Tone, widget: select, options: [surface, dark], default: surface }
          - name: faq
            label: FAQ
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Questions
                label_singular: Question
                widget: list
                min: 1
                fields:
                  - { name: question, label: Question, widget: string }
                  - { name: answer, label: Answer, widget: markdown }
          - name: cta
            label: Call to action
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - { name: button, label: Button, widget: object, fields: *labeled_link }
              - { name: secondaryButton, label: Second button, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [banner, card], default: banner }
              - { name: tone, label: Tone, widget: select, options: [accent, dark, surface], default: accent }
          - name: hours-location
            label: Hours and location
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - { name: address, label: Address, widget: text, required: false, hint: "Type {address} to use the address from Facts." }
              - name: hours
                label: Opening hours
                label_singular: Opening hours row
                widget: list
                required: false
                fields:
                  - { name: days, label: Days, widget: string }
                  - { name: time, label: Time, widget: string }
              - { name: phone, label: Phone, widget: string, required: false, hint: "Type {phone} to use the phone number from Facts." }
              - { name: email, label: Email, widget: string, required: false, hint: "Type {email} to use the email address from Facts." }
              - { name: note, label: Note, widget: text, required: false }
              - { name: mapLink, label: Map link, widget: object, required: false, fields: *labeled_link }
          - name: trust-bar
            label: Trust bar
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Items
                label_singular: Item
                widget: list
                min: 1
                fields:
                  - { name: text, label: Text, widget: string }
              - { name: variant, label: Variant, widget: select, options: [line, chips], default: line }
          - name: stats
            label: Stats
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Figures
                label_singular: Figure
                widget: list
                min: 2
                max: 4
                fields: &stat_fields
                  - { name: value, label: Value, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: tone, label: Tone, widget: select, options: [plain, dark], default: plain }
          - name: steps
            label: Steps
            widget: object
            fields:
              - *section_id
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - name: items
                label: Steps
                label_singular: Step
                widget: list
                min: 1
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text, required: false }
          - name: split
            label: Image and text
            widget: object
            fields:
              - *section_id
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: body, label: Body, widget: markdown, required: false }
              - { name: image, label: Image, widget: image }
              - { name: imageAlt, label: Image alt text, widget: string, required: false }
              - { name: stats, label: Figures, label_singular: Figure, widget: list, required: false, max: 4, fields: *stat_fields }
              - { name: link, label: Link, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [image-left, image-right], default: image-left }
              - { name: tone, label: Tone, widget: select, options: [plain, surface], default: plain }
          - name: team
            label: Team
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - name: items
                label: People
                label_singular: Person
                widget: list
                min: 1
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string, required: false }
                  - { name: image, label: Photo, widget: image, required: false }
                  - { name: imageAlt, label: Photo alt text, widget: string, required: false }
          - name: pricing-list
            label: Pricing list
            widget: object
            fields:
              - *section_id
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Prices
                label_singular: Price
                widget: list
                min: 1
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: price, label: Price as shown, widget: string }
              - { name: note, label: Note, widget: text, required: false }

  - name: settings
    label: Settings
    files:
      - name: site
        label: Site
        file: src/content/settings/site.yml
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: language, label: Language (BCP 47), widget: string }
          - name: logo
            label: Logo
            widget: object
            required: false
            fields:
              - { name: image, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string }
          - name: nav
            label: Navigation
            widget: list
            fields: &link_fields
              - { name: label, label: Label, widget: string }
              - { name: link, label: Link, widget: string }
          # The header's actions and the footer's blocks (site-kit-design-system
          # design D35). Business facts, such as a phone number or opening
          # hours, are props of the block that shows them.
          - name: header
            label: Header
            widget: object
            required: false
            fields:
              - name: actions
                label: Actions
                label_singular: Action
                widget: list
                required: false
                typeKey: type
                types:
                  - name: phone
                    label: Phone number
                    widget: object
                    fields:
                      - { name: number, label: Number, widget: string, hint: "Type {phone} to use the phone number from Facts." }
                      - { name: callLabel, label: Call button label (adds an icon-only call button), widget: string, required: false }
                  - name: button
                    label: Button
                    widget: object
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: link, label: Link, widget: string }
                      - { name: style, label: Style, widget: select, options: [primary, secondary], default: primary }
                  - name: link
                    label: Link
                    widget: object
                    fields: *link_fields
          - name: footer
            label: Footer
            widget: object
            required: false
            fields:
              - name: blocks
                label: Blocks
                label_singular: Block
                widget: list
                required: false
                typeKey: type
                types: &footer_block_types
                  - name: brand
                    label: Name or logo
                    widget: object
                    fields:
                      - { name: text, label: Text, widget: text, required: false }
                      - &with_previous { name: withPrevious, label: Same group as the block before, widget: boolean, default: false, required: false }
                  - name: contact
                    label: Contact details
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - { name: address, label: Address, widget: text, required: false, hint: "Type {address} to use the address from Facts." }
                      - { name: phone, label: Phone, widget: string, required: false, hint: "Type {phone} to use the phone number from Facts." }
                      - { name: email, label: Email, widget: string, required: false, hint: "Type {email} to use the email address from Facts." }
                      - *with_previous
                  - name: links
                    label: Links
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - { name: links, label: Links, widget: list, fields: *link_fields }
                      - *with_previous
                  - name: hours
                    label: Hours
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - name: rows
                        label: Rows
                        label_singular: Row
                        widget: list
                        fields:
                          - { name: days, label: Days, widget: string }
                          - { name: time, label: Time, widget: string }
                      - *with_previous
                  - name: text
                    label: Text
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - { name: text, label: Text, widget: text }
                      - *with_previous
                  - name: copyright
                    label: Copyright line
                    widget: object
                    fields:
                      - { name: text, label: Text after the year (the site name if empty), widget: string, required: false }
                      - *with_previous
              - name: bottom
                label: Bottom row
                label_singular: Block
                widget: list
                required: false
                typeKey: type
                types: *footer_block_types
          - name: seo
            label: Search and sharing defaults
            widget: object
            fields:
              - { name: description, label: Description, widget: text }
              - { name: ogImage, label: Social image, widget: image, required: false }
          - name: facts
            label: Facts
            label_singular: Fact
            widget: list
            required: false
            hint: "Facts that appear in several places, such as the phone number. Any text on the site can use one as {name}, such as {phone}, and shows its value."
            fields:
              - { name: name, label: Name, widget: string, pattern: ["^[a-z][a-zA-Z0-9]*$", "A lowercase letter, then letters or digits, such as phone or licenseNo"] }
              - { name: value, label: Value, widget: text }
          - name: ui
            label: Interface text
            widget: object
            fields:
              - { name: skipLink, label: Skip link, widget: string }
              - { name: menu, label: Menu button, widget: string }
              - { name: readMore, label: Read more link, widget: string }
              - { name: mainNav, label: Main navigation name, widget: string }
              - { name: footerNav, label: Name of the footer links without a title, widget: string }
              - { name: breadcrumb, label: Breadcrumb name, widget: string }
              - { name: home, label: Breadcrumb home link, widget: string }

  # Pages with `template: custom`, one file each, with the props their
  # hand-written page declares. They also show in the pages collection.
  - name: custom-pages
    label: Custom pages
    files:
      - name: about
        label: About
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Description, widget: text, required: false }
          - { name: ogImage, label: Social image, widget: image, required: false }
          - { name: template, label: Template, widget: hidden, default: custom }
          - { name: eyebrow, label: Eyebrow, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: image, label: Image, widget: image }
          - { name: imageAlt, label: Image alt text, widget: string }
          - *sections

  - name: news
    label: Blog
    label_singular: Blog post
    folder: src/content/news
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { name: category, label: Category, widget: select, options: [Planning, Renovation, Maintenance, News], required: false }
      - { name: description, label: Description, widget: text, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: imageAlt, label: Image alt text, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, required: false }
      - { name: body, label: Body, widget: markdown }
