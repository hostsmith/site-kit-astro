name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # cog computes the next version from Conventional Commits. Its pre-bump hook
  # sets the package's version and every example's dependency on it, and the
  # bump commit "chore(version): X.Y.Z" goes to main with the tag vX.Y.Z. The
  # publish job below then publishes the package to npm.
  #
  # main only takes pull requests. The release GitHub App is a bypass actor on
  # main's ruleset, so the bump commit is pushed with the App's token (secrets
  # RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY, as in mcp-server).
  release:
    # Kit-only, and skipped on the bot's own version commit.
    if: >-
      github.repository == 'hostsmith/site-kit-astro' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(version):'))
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.tag.outputs.released }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Get the release App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # The checkout keeps the App token, so `git push` below runs as the App.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Capture pre-bump tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Bump
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        # Resolve tag checks the outcome, so a failure here doesn't stop the job.
        continue-on-error: true
        with:
          command: bump
          args: --auto
          git-user: github-actions[bot]
          git-user-email: 41898282+github-actions[bot]@users.noreply.github.com

      # No new tag means either nothing to release, or cog failed. A dry run
      # tells them apart: it prints a version only when one is due. Its exit
      # code doesn't: cog 6 (the action's) exits 0 with a message when there
      # is nothing to bump, cog 7 exits 1.
      - name: Resolve tag
        id: tag
        env:
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$AFTER" && "$AFTER" != "$BEFORE" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER" >> "$GITHUB_OUTPUT"
          elif ! command -v cog >/dev/null; then
            echo "::error::cog isn't installed. See the Bump step's log."
            exit 1
          elif NEXT=$(cog bump --auto --dry-run 2>/dev/null | grep -Ex 'v?[0-9]+\.[0-9]+\.[0-9]+'); then
            echo "::error::Commits since '$BEFORE' need release $NEXT, but cog bump made no tag. See the Bump step's log."
            exit 1
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since '$BEFORE'"
          fi

      # Atomic: the version commit and the tag land together or not at all.
      - name: Push the version commit and tag
        if: steps.tag.outputs.released == 'true'
        run: git push --atomic origin "HEAD:${{ github.ref_name }}" "${{ steps.tag.outputs.tag }}"

      - name: Generate release notes
        if: steps.tag.outputs.released == 'true'
        id: changelog
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: changelog
          args: --at ${{ steps.tag.outputs.tag }}

      - name: Create GitHub release
        if: steps.tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.stdout }}
        run: |
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

  # Publishes @hostsmith/site-kit-astro from the release tag, with provenance.
  # npm authenticates the job by GitHub OIDC through the package's trusted
  # publisher (this repository, release.yml), so there is no npm token. A
  # failed publish can be re-run: the tag and the GitHub release stay.
  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - run: npm test

      - run: npm publish --workspace packages/site-kit-astro --provenance --access public

      # The package as a site gets it: installed from the registry into a copy
      # of the basics example outside the workspace, which pins the released
      # version, then built (site-kit-updates design D26). The registry can
      # take a moment to serve a new version.
      - name: Check the published package
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          cp -R examples/basics "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          for attempt in 1 2 3 4 5 6; do
            if npm install --no-audit --no-fund; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            echo "The registry doesn't serve ${TAG#v} yet. Retrying in 20 seconds."
            sleep 20
          done
          npm run build
