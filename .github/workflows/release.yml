name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # cog computes the next version from Conventional Commits. Its pre-bump hook
  # sets the package's version and every example's dependency on it, and cog
  # makes the bump commit "chore(version): X.Y.Z" with the tag vX.Y.Z. The
  # tests run on that commit, with its tag, and only then do both go to main.
  # The publish job below then publishes the package to npm. v0.6.0 was pushed
  # before its tests ran, failed them in the publish job, and never reached npm.
  #
  # main only takes pull requests. The release GitHub App is a bypass actor on
  # main's ruleset, so the bump commit is pushed with the App's token (secrets
  # RELEASE_APP_CLIENT_ID and RELEASE_APP_PRIVATE_KEY, as in mcp-server). The
  # token is made after the tests, so no test code runs with it.
  release:
    # Kit-only, and skipped on the bot's own version commit.
    if: >-
      github.repository == 'hostsmith/site-kit-astro' &&
      (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(version):'))
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.tag.outputs.released }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Without credentials: the tests run in this job. The push below passes
      # the App's token itself.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions

      - name: Capture pre-bump tag
        id: before
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Bump
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        # Resolve tag checks the outcome, so a failure here doesn't stop the job.
        continue-on-error: true
        with:
          command: bump
          args: --auto
          git-user: github-actions[bot]
          git-user-email: 41898282+github-actions[bot]@users.noreply.github.com

      # No new tag means either nothing to release, or cog failed. A dry run
      # tells them apart: it prints a version only when one is due. Its exit
      # code doesn't: cog 6 (the action's) exits 0 with a message when there
      # is nothing to bump, cog 7 exits 1.
      - name: Resolve tag
        id: tag
        env:
          BEFORE: ${{ steps.before.outputs.tag }}
        run: |
          AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$AFTER" && "$AFTER" != "$BEFORE" ]]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "tag=$AFTER" >> "$GITHUB_OUTPUT"
          elif ! command -v cog >/dev/null; then
            echo "::error::cog isn't installed. See the Bump step's log."
            exit 1
          elif NEXT=$(cog bump --auto --dry-run 2>/dev/null | grep -Ex 'v?[0-9]+\.[0-9]+\.[0-9]+'); then
            echo "::error::Commits since '$BEFORE' need release $NEXT, but cog bump made no tag. See the Bump step's log."
            exit 1
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commits since '$BEFORE'"
          fi

      # The release as it will be pushed: the version commit, with its tag. A
      # failure here leaves main, the tags and npm as they were.
      - name: Install
        if: steps.tag.outputs.released == 'true'
        run: npm ci

      - name: Test the release
        if: steps.tag.outputs.released == 'true'
        run: npm test

      - name: Install Chromium for the browser tests
        if: steps.tag.outputs.released == 'true'
        run: npx playwright install --with-deps chromium

      - name: Test the release in a browser
        if: steps.tag.outputs.released == 'true'
        run: npm run test:browser

      - name: Get the release App token
        if: steps.tag.outputs.released == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      # Atomic: the version commit and the tag land together or not at all.
      # As the App, whose token the action masks in the log.
      - name: Push the version commit and tag
        if: steps.tag.outputs.released == 'true'
        env:
          TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
        run: git push --atomic "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git" "HEAD:${{ github.ref_name }}" "${{ steps.tag.outputs.tag }}"

      - name: Generate release notes
        if: steps.tag.outputs.released == 'true'
        id: changelog
        uses: cocogitto/cocogitto-action@9a9fe03b31c47444290c0d7f9b1ee1b44ee13f20 # v4.1.0
        with:
          command: changelog
          args: --at ${{ steps.tag.outputs.tag }}

      - name: Create GitHub release
        if: steps.tag.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.stdout }}
        run: |
          printf '%s\n' "$NOTES" > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md

  # Publishes @hostsmith/site-kit-astro from the release tag, with provenance.
  # The release job tested the tag's commit. npm authenticates the job by
  # GitHub OIDC through the package's trusted publisher (this repository,
  # release.yml), so there is no npm token. A failed job can be re-run: the
  # tag and the GitHub release stay, and a version npm already accepted isn't
  # published again.
  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      # On a re-run, npm refuses the version it already accepted; the job then
      # goes on to the check.
      - name: Publish
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if npm publish --workspace packages/site-kit-astro --provenance --access public 2> "$RUNNER_TEMP/publish.log"; then
            cat "$RUNNER_TEMP/publish.log" >&2
            exit 0
          fi
          cat "$RUNNER_TEMP/publish.log" >&2
          if grep -q "cannot publish over the previously published versions" "$RUNNER_TEMP/publish.log"; then
            echo "npm already has ${TAG#v}: this is a re-run. Going on to the check."
            exit 0
          fi
          exit 1

      # The package as a site gets it: installed from the registry into a copy
      # of the basics example outside the workspace, which pins the released
      # version, then built (site-kit-updates design D26). npm processes a
      # publish before serving it, which took six and a half minutes for
      # v0.5.0, so the check first waits up to 30 minutes for the version.
      - name: Check the published package
        timeout-minutes: 40
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          version="${TAG#v}"
          for attempt in $(seq 60); do
            if [ "$(npm view "@hostsmith/site-kit-astro@$version" version 2>/dev/null)" = "$version" ]; then break; fi
            if [ "$attempt" = 60 ]; then
              echo "::error::npm doesn't serve $version after 30 minutes. Check the package on npmjs.com, then re-run this job."
              exit 1
            fi
            echo "npm doesn't serve $version yet. Checking again in 30 seconds."
            sleep 30
          done
          cp -R examples/basics "$RUNNER_TEMP/site"
          cd "$RUNNER_TEMP/site"
          npm install --no-audit --no-fund
          npm run build
