# Builds the site and deploys it to Hostsmith.
#
# - A push to main deploys to the production site (`site.id` in hostsmith.json).
# - A push to another branch deploys to the preview site
#   (repository variable HOSTSMITH_PREVIEW_SITE_ID), or only builds without one.
# - A manual run deploys to the target chosen when starting it.
#
# Settings:
# - secret HOSTSMITH_TOKEN: a Hostsmith API token restricted to the production
#   and preview sites, with the "Deploy" permissions
# - variable HOSTSMITH_PREVIEW_SITE_ID: the preview site (optional)
# - variable HOSTSMITH_PARTITION: "us" or "eu", when the sites aren't in the
#   account's home partition (optional)
# - variable SITE_NOINDEX: "true" until the DNS switch. Previews are always no-index.
name: Hostsmith

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  deploy:
    # The kit's own template repository never deploys.
    if: github.repository != 'hostsmith/site-kit'
    runs-on: ubuntu-latest
    env:
      HOSTSMITH_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'production' || 'preview') }}
    # One deploy per target at a time. A running deploy finishes; a newer push
    # replaces the one waiting, so the site ends on the newest commit.
    concurrency:
      group: hostsmith-${{ github.event_name == 'workflow_dispatch' && inputs.target || (github.ref_name == 'main' && 'production' || 'preview') }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read hostsmith.json
        id: manifest
        run: |
          {
            echo "node=$(jq -er '.build.node' hostsmith.json)"
            echo "command=$(jq -er '.build.command' hostsmith.json)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.manifest.outputs.node }}
          cache: npm

      - name: Check configuration
        id: check
        env:
          HOSTSMITH_TOKEN: ${{ secrets.HOSTSMITH_TOKEN }}
          HOSTSMITH_PREVIEW_SITE_ID: ${{ vars.HOSTSMITH_PREVIEW_SITE_ID }}
          HOSTSMITH_PARTITION: ${{ vars.HOSTSMITH_PARTITION }}
        run: node scripts/hostsmith-deploy.mjs check

      - run: npm ci

      - name: Build
        env:
          SITE_NOINDEX: ${{ env.HOSTSMITH_TARGET == 'preview' && 'true' || vars.SITE_NOINDEX }}
          BUILD_COMMAND: ${{ steps.manifest.outputs.command }}
        run: $BUILD_COMMAND

      - name: Deploy
        if: steps.check.outputs.deploy == 'true'
        env:
          HOSTSMITH_TOKEN: ${{ secrets.HOSTSMITH_TOKEN }}
          HOSTSMITH_PREVIEW_SITE_ID: ${{ vars.HOSTSMITH_PREVIEW_SITE_ID }}
          HOSTSMITH_PARTITION: ${{ vars.HOSTSMITH_PARTITION }}
        run: node scripts/hostsmith-deploy.mjs deploy
