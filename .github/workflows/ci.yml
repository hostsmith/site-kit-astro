name: Kit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # The kit's own tests. Sites created from the template don't run them.
    if: github.repository == 'hostsmith/site-kit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run check:urls

      - run: npm test
