# Decap CMS config: the kit's part. `npm run decap-config` assembles
# public/admin/config.yml from this file and the site's part,
# public/admin/config.site.yml, which replaces each `# site:` line below.
#
# Only the Decap-compatible subset is used, so Decap and Sveltia CMS both read
# the assembled file. src/content.config.ts mirrors these fields by hand:
# change both files in the same commit.
backend:
  name: github
  # site: repo
  branch: main
media_folder: public/assets
public_folder: /assets

collections:
  - name: pages
    label: Pages
    label_singular: Page
    folder: src/content/pages
    # Lists nested pages, such as services/painting.en.md, each a file of its
    # own rather than an _index.md in a folder. A new page is still saved
    # flat, as <slug>.<locale>.md.
    nested: { depth: 4, subfolders: false }
    extension: md
    format: frontmatter
    create: true
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false }
      - { name: ogImage, label: Social image, widget: image, required: false }
      # `template: custom` on a page that a page template renders. Hidden, so a
      # save keeps it and an owner doesn't change it.
      - { name: template, label: Template, widget: hidden, required: false }
      - &sections
        name: sections
        label: Sections
        widget: list
        typeKey: type
        types:
          - name: hero
            label: Hero
            widget: object
            fields:
              - &section_id { name: id, label: Section id, widget: string, pattern: ["^[a-z](?=[a-z0-9]*[0-9])[a-z0-9]{3}$", "A lowercase letter, then 3 lowercase letters or digits, with at least one digit"], hint: "A random label that keeps pointing at this section when sections move. For a new section, run npm run section-id -- <page file> for an id this page has never used, such as k3m9. Never change it or copy it from another section." }
              # Every section type, the site's own too, can ask the theme for an entrance animation.
              - &section_reveal { name: reveal, label: Entrance animation, widget: select, options: [fade, fade-up, fade-down, slide-left, slide-right, scale], required: false, hint: "The theme animates the section as it scrolls into view, unless the visitor asks for reduced motion." }
              - &eyebrow_field { name: eyebrow, label: Eyebrow, widget: string, required: false }
              - { name: badge, label: Badge, widget: string, required: false }
              - { name: title, label: Title, widget: string }
              - { name: subtitle, label: Subtitle, widget: string, required: false }
              - { name: image, label: Image, widget: image, required: false }
              - { name: imageAlt, label: Image alt text, widget: string, required: false }
              - &video_field { name: video, label: Video (MP4; the image is its poster), widget: file, required: false, hint: "A short, muted, looping clip. The hero takes one only with the background variant." }
              - &video_webm_field { name: videoWebm, label: Video as WebM (optional), widget: file, required: false }
              - name: cta
                label: Call to action
                widget: object
                required: false
                # Not required here: Decap requires the subfields of an empty
                # optional object, and refuses to save. The build's schemas
                # still require both when the object is there.
                fields: &labeled_link
                  - { name: label, label: Label, widget: string, required: false }
                  - { name: link, label: Link, widget: string, required: false }
              - { name: secondaryCta, label: Second button, widget: object, required: false, fields: *labeled_link }
              - { name: note, label: Note under the buttons, widget: string, required: false }
              # A select with a default isn't required: Decap fails one left at
              # its default, and the build applies the default.
              - { name: variant, label: Variant, widget: select, options: [centered, image-left, image-right, background, page], default: centered, required: false }
          - name: rich-text
            label: Rich text
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: body, label: Body, widget: markdown }
              - { name: variant, label: Variant, widget: select, options: [narrow, wide, title-aside], default: narrow, required: false }
          - name: collection-list
            label: Collection list
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: collection
                label: Collection
                widget: select
                # site: collection options
              - { name: limit, label: Limit, widget: number, value_type: int, min: 1, required: false }
              - { name: link, label: Link beside the title, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [cards, list, featured], default: cards, required: false }
          - name: services-grid
            label: Services grid
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: link, label: Link beside the title, widget: object, required: false, fields: *labeled_link }
              - name: items
                label: Services
                label_singular: Service
                widget: list
                min: 1
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text, required: false }
                  # The kit's icon set: src/lib/icons.ts lists the same names.
                  - &icon_field
                    name: icon
                    label: Icon
                    widget: select
                    required: false
                    options:
                      [calendar, check, clock, file-text, hammer, house, mail, map-pin, paint-roller, phone, ruler, shield-check, sparkles, star, users, wrench]
                  - { name: image, label: Image, widget: image, required: false }
                  - { name: imageAlt, label: Image alt text, widget: string, required: false }
                  - { name: link, label: Link, widget: string, required: false }
              - { name: variant, label: Variant, widget: select, options: [cards, list], default: cards, required: false }
              - { name: tone, label: Tone, widget: select, options: [plain, surface], default: plain, required: false }
          - name: gallery
            label: Gallery
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: images
                label: Images
                label_singular: Image
                widget: list
                min: 1
                fields:
                  - { name: image, label: Image, widget: image }
                  - { name: alt, label: Alt text, widget: string }
                  - { name: caption, label: Caption, widget: string, required: false }
              - { name: lightbox, label: Open images large, widget: boolean, default: false, required: false }
              - { name: variant, label: Variant, widget: select, options: [grid, masonry], default: grid, required: false }
          - name: testimonials
            label: Testimonials
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Testimonials
                label_singular: Testimonial
                widget: list
                min: 1
                fields:
                  - { name: quote, label: Quote, widget: text }
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string, required: false }
                  - { name: image, label: Photo, widget: image, required: false }
                  - { name: imageAlt, label: Photo alt text, widget: string, required: false }
              - { name: variant, label: Variant, widget: select, options: [grid, single], default: grid, required: false }
              - { name: tone, label: Tone, widget: select, options: [surface, dark], default: surface, required: false }
          - name: faq
            label: FAQ
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Questions
                label_singular: Question
                widget: list
                min: 1
                fields:
                  - { name: question, label: Question, widget: string }
                  - { name: answer, label: Answer, widget: markdown }
          - name: cta
            label: Call to action
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text, required: false }
              - { name: button, label: Button, widget: object, fields: *labeled_link }
              - { name: secondaryButton, label: Second button, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [banner, card], default: banner, required: false }
              - { name: tone, label: Tone, widget: select, options: [accent, dark, surface], default: accent, required: false }
          - name: hours-location
            label: Hours and location
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: address, label: Address, widget: text, required: false, hint: "Type {address} to use the address from Facts." }
              - name: hours
                label: Opening hours
                label_singular: Opening hours row
                widget: list
                required: false
                fields:
                  - { name: days, label: Days, widget: string }
                  - { name: time, label: Time, widget: string }
              - { name: phone, label: Phone, widget: string, required: false, hint: "Type {phone} to use the phone number from Facts." }
              - { name: email, label: Email, widget: string, required: false, hint: "Type {email} to use the email address from Facts." }
              - { name: note, label: Note, widget: text, required: false }
              - { name: mapLink, label: Map link, widget: object, required: false, fields: *labeled_link }
          - name: trust-bar
            label: Trust bar
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Items
                label_singular: Item
                widget: list
                min: 1
                fields:
                  - { name: text, label: Text, widget: string }
              - { name: variant, label: Variant, widget: select, options: [line, chips], default: line, required: false }
          - name: stats
            label: Stats
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Figures
                label_singular: Figure
                widget: list
                min: 2
                max: 4
                fields: &stat_fields
                  - { name: value, label: Value, widget: string }
                  - { name: label, label: Label, widget: string }
              - { name: tone, label: Tone, widget: select, options: [plain, dark], default: plain, required: false }
          - name: steps
            label: Steps
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - name: items
                label: Steps
                label_singular: Step
                widget: list
                min: 1
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: text, label: Text, widget: text, required: false }
          - name: split
            label: Image and text
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: body, label: Body, widget: markdown, required: false }
              - { name: image, label: Image, widget: image }
              - { name: imageAlt, label: Image alt text, widget: string, required: false }
              - *video_field
              - *video_webm_field
              - { name: stats, label: Figures, label_singular: Figure, widget: list, required: false, max: 4, fields: *stat_fields }
              - { name: link, label: Link, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [image-left, image-right], default: image-left, required: false }
              - { name: tone, label: Tone, widget: select, options: [plain, surface], default: plain, required: false }
          - name: team
            label: Team
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - name: items
                label: People
                label_singular: Person
                widget: list
                min: 1
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string, required: false }
                  - { name: image, label: Photo, widget: image, required: false }
                  - { name: imageAlt, label: Photo alt text, widget: string, required: false }
          - name: pricing-list
            label: Pricing list
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - name: items
                label: Prices
                label_singular: Price
                widget: list
                min: 1
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: price, label: Price as shown, widget: string }
              - { name: note, label: Note, widget: text, required: false }
          - name: tabs
            label: Tabs
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - name: items
                label: Tabs
                label_singular: Tab
                widget: list
                min: 2
                fields:
                  - { name: label, label: Tab label, widget: string }
                  - { name: title, label: Title, widget: string, required: false }
                  - { name: body, label: Body, widget: markdown, required: false }
                  - { name: image, label: Image, widget: image, required: false }
                  - { name: imageAlt, label: Image alt text, widget: string, required: false }
                  - { name: link, label: Link, widget: object, required: false, fields: *labeled_link }
              - { name: variant, label: Variant, widget: select, options: [horizontal, vertical], default: horizontal, required: false }
          - name: slider
            label: Slider
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title, widget: string, required: false }
              - { name: intro, label: Intro, widget: text, required: false }
              - name: slides
                label: Slides
                label_singular: Slide
                widget: list
                min: 1
                fields:
                  - { name: image, label: Image, widget: image, required: false }
                  - { name: imageAlt, label: Image alt text, widget: string, required: false }
                  - { name: title, label: Title, widget: string, required: false }
                  - { name: body, label: Body, widget: markdown, required: false }
                  - { name: link, label: Link, widget: object, required: false, fields: *labeled_link }
              - { name: autoplay, label: Seconds between slides (empty for no rotation), widget: number, value_type: float, min: 3, required: false }
              - { name: variant, label: Variant, widget: select, options: [full, cards], default: full, required: false }
          - name: embed
            label: Map, video or other embed
            widget: object
            fields:
              - *section_id
              - *section_reveal
              - *eyebrow_field
              - { name: title, label: Title (also names the frame), widget: string }
              - { name: url, label: URL (https), widget: string, pattern: ["^https://", "Starts with https://"] }
              - { name: kind, label: Kind, widget: select, options: [map, video, other], default: other, required: false, hint: "A video is a YouTube or Vimeo link." }
              - { name: aspect, label: Aspect ratio, widget: select, options: ["16:9", "4:3", "1:1", "21:9"], default: "16:9", required: false }
              - { name: caption, label: Caption, widget: string, required: false }
              - { name: load, label: Loads, widget: select, options: [click, direct], default: click, required: false, hint: "click shows a button first, so nothing loads from the provider until the visitor asks. Use direct only when the site's privacy notice names the provider." }
          # site: section types

  # npm run decap-config makes this a folder collection, src/content/settings,
  # with one site.<locale>.yml per locale. The language isn't a setting: it is
  # the locale's tag in src/site.config.ts.
  - name: settings
    label: Settings
    files:
      - name: site
        label: Site
        file: src/content/settings/site.yml
        fields:
          - { name: name, label: Site name, widget: string }
          - name: logo
            label: Logo
            widget: object
            required: false
            # Not required here, as for &labeled_link: the build's schema
            # requires both when there's a logo.
            fields:
              - { name: image, label: Image, widget: image, required: false }
              - { name: alt, label: Alt text, widget: string, required: false }
          - name: nav
            label: Navigation
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: link, label: Link (optional with sub-items), widget: string, required: false }
              - name: children
                label: Sub-items
                label_singular: Sub-item
                widget: list
                required: false
                hint: "Links under this item, one level deep, shown as a dropdown in the header."
                fields: &link_fields
                  - { name: label, label: Label, widget: string }
                  - { name: link, label: Link, widget: string }
          # The header's actions and the footer's blocks (site-kit-design-system
          # design D35). Business facts, such as a phone number or opening
          # hours, are props of the block that shows them.
          - name: header
            label: Header
            widget: object
            required: false
            fields:
              - name: actions
                label: Actions
                label_singular: Action
                widget: list
                required: false
                typeKey: type
                types:
                  - name: phone
                    label: Phone number
                    widget: object
                    fields:
                      - { name: number, label: Number, widget: string, hint: "Type {phone} to use the phone number from Facts." }
                      - { name: callLabel, label: Call button label (adds an icon-only call button), widget: string, required: false }
                  - name: button
                    label: Button
                    widget: object
                    fields:
                      - { name: label, label: Label, widget: string }
                      - { name: link, label: Link, widget: string }
                      - { name: style, label: Style, widget: select, options: [primary, secondary], default: primary, required: false }
                      - { name: pinned, label: Also beside the menu button on narrow screens, widget: boolean, required: false }
                  - name: link
                    label: Link
                    widget: object
                    fields: *link_fields
                  # A site with several locales: links to the page in each
                  # language. It has no props, but Decap rejects a type
                  # without fields, so it gets a hidden one with no value,
                  # which neither CMS writes.
                  - name: locales
                    label: Language switcher
                    widget: object
                    fields: [{ name: switcher, label: Language switcher, widget: hidden }]
          - name: footer
            label: Footer
            widget: object
            required: false
            fields:
              - name: blocks
                label: Blocks
                label_singular: Block
                widget: list
                required: false
                typeKey: type
                types: &footer_block_types
                  - name: brand
                    label: Name or logo
                    widget: object
                    fields:
                      - { name: text, label: Text, widget: text, required: false }
                      - { name: logo, label: Own logo (replaces the site's logo here), widget: image, required: false }
                      - { name: logoAlt, label: Own logo alt text, widget: string, required: false }
                      - &with_previous { name: withPrevious, label: Same group as the block before, widget: boolean, default: false, required: false }
                  - name: contact
                    label: Contact details
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - { name: address, label: Address, widget: text, required: false, hint: "Type {address} to use the address from Facts." }
                      - { name: phone, label: Phone, widget: string, required: false, hint: "Type {phone} to use the phone number from Facts." }
                      - { name: email, label: Email, widget: string, required: false, hint: "Type {email} to use the email address from Facts." }
                      - *with_previous
                  - name: links
                    label: Links
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - { name: links, label: Links, widget: list, fields: *link_fields }
                      - *with_previous
                  - name: hours
                    label: Hours
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - name: rows
                        label: Rows
                        label_singular: Row
                        widget: list
                        fields:
                          - { name: days, label: Days, widget: string }
                          - { name: time, label: Time, widget: string }
                      - *with_previous
                  - name: text
                    label: Text
                    widget: object
                    fields:
                      - { name: title, label: Title, widget: string, required: false }
                      - { name: text, label: Text, widget: text }
                      - *with_previous
                  - name: copyright
                    label: Copyright line
                    widget: object
                    fields:
                      - { name: text, label: Text after the year (the site name if empty), widget: string, required: false }
                      - *with_previous
                  # A site with several locales: links to the page in each language.
                  - name: locales
                    label: Language switcher
                    widget: object
                    fields:
                      - *with_previous
              - name: bottom
                label: Bottom row
                label_singular: Block
                widget: list
                required: false
                typeKey: type
                types: *footer_block_types
          - name: seo
            label: Search and sharing defaults
            widget: object
            fields:
              - { name: description, label: Description, widget: text }
              - { name: ogImage, label: Social image, widget: image, required: false }
          - name: facts
            label: Facts
            label_singular: Fact
            widget: list
            required: false
            hint: "Facts that appear in several places, such as the phone number. Any text on the site can use one as {name}, such as {phone}, and shows its value."
            fields:
              - { name: name, label: Name, widget: string, pattern: ["^[a-z][a-zA-Z0-9]*$", "A lowercase letter, then letters or digits, such as phone or licenseNo"] }
              - { name: value, label: Value, widget: text }
          - name: ui
            label: Interface text
            widget: object
            fields:
              - { name: skipLink, label: Skip link, widget: string }
              - { name: menu, label: Menu button, widget: string }
              - { name: readMore, label: Read more link, widget: string }
              - { name: mainNav, label: Main navigation name, widget: string }
              - { name: footerNav, label: Name of the footer links without a title, widget: string }
              - { name: breadcrumb, label: Breadcrumb name, widget: string }
              - { name: home, label: Breadcrumb home link, widget: string }
              - { name: locales, label: Language switcher name (a site with several locales), widget: string, required: false }
              # The interactive parts' strings: a page that shows a part needs its own.
              - { name: sliderPrevious, label: Slider - previous button, widget: string, required: false }
              - { name: sliderNext, label: Slider - next button, widget: string, required: false }
              - { name: sliderPause, label: Slider - pause button, widget: string, required: false }
              - { name: sliderPlay, label: Slider - play button, widget: string, required: false }
              - { name: sliderStatus, label: "Slider - status, with {current} and {total}", widget: string, required: false }
              - { name: lightboxClose, label: Gallery lightbox - close button, widget: string, required: false }
              - { name: lightboxPrevious, label: Gallery lightbox - previous button, widget: string, required: false }
              - { name: lightboxNext, label: Gallery lightbox - next button, widget: string, required: false }
              - { name: videoPause, label: Video - pause button, widget: string, required: false }
              - { name: videoPlay, label: Video - play button, widget: string, required: false }
              - { name: embedShowMap, label: Embed - button that loads a map, widget: string, required: false }
              - { name: embedPlayVideo, label: Embed - button that loads a video, widget: string, required: false }
              - { name: embedShowContent, label: Embed - button that loads other content, widget: string, required: false }
              - { name: embedNotice, label: "Embed - notice, with {host}", widget: string, required: false }
              - { name: embedOpen, label: "Embed - link to the content on its site, with {host}", widget: string, required: false }
              - { name: navSubmenu, label: "Navigation - submenu button of a linked item, with {label}", widget: string, required: false }
              # site: ui

  # site: collections
